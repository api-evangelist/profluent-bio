aid: profluent-bio
name: Profluent
description: >-
  Profluent is a Berkeley, California AI biology company building frontier
  protein language models and using them to design functional proteins for
  therapeutics, gene editing, agriculture, and industrial enzymes. Founded by
  Ali Madani — previously architect of the ProGen large language model for
  proteins at Salesforce AI Research — Profluent pairs in-house foundation
  models with a wet lab to author novel proteins from scratch and validate
  them experimentally. The company's research has been published in Nature
  Biotechnology and Nature, and it is best known for OpenCRISPR-1, which it
  describes as the world's first AI-designed gene editor, released freely
  for research and commercial use. Profluent also publishes the ProGen3
  family of protein generation models, ProseLM for structure-conditioned
  protein design, the E1 family of protein encoder models, Protein2PAM for
  CRISPR-Cas PAM specificity prediction, and the CRISPR-Cas Atlas dataset.
  Commercial partnerships include a multi-target collaboration with Eli
  Lilly worth up to $2.25 billion, and deals with Ensoma, Corteva, Integrated
  DNA Technologies, and the Rett Syndrome Research Trust. Profluent is
  backed by Spark Capital, Insight Partners, Air Street Capital, Altimeter,
  and Bezos Expeditions. The company does not publish a hosted developer
  REST API or commercial SDK; its surface area for external builders is the
  Profluent-AI GitHub organization (model weights and inference code), the
  Protein2PAM web tool, and partnership engagements.
